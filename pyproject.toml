[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kubernetes-selectors"
version = "0.1.0"
description = "Parse and match Kubernetes label selectors and field selectors with the exact grammar, error messages and canonical strings of k8s.io/apimachinery."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND Apache-2.0 AND BSD-3-Clause"
license-files = ["LICENSE", "LICENSE-apache", "LICENSE-go"]
authors = [{name = "kofiadeyemiq"}]
keywords = ["kubernetes", "k8s", "label-selector", "field-selector", "selector", "apimachinery"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/quietpelican42/kubernetes-selectors"

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kubernetes_selectors = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests", "bench"]
